server:
  port: ${GATEWAY_PORT:9000}
  shutdown: graceful

spring:
  application:
    name: ems-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must be issued by this realm and be meant for the EMS API.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ems}
          # Because the key set URL is given explicitly, the gateway does not
          # contact Keycloak at startup. Keys are fetched on the first request.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ems/protocol/openid-connect/certs}
          audiences: ems-api
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # Backends may also send CORS headers. Keep only the first copy of each.
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          httpclient:
            connect-timeout: 3000
            response-timeout: 30s
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/api/**]':
                # Comma-separated list of browser origins allowed to call the API
                # directly, for example the React dev server.
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,X-Request-Id
                exposed-headers: X-Request-Id
                allow-credentials: false
                max-age: 3600
          routes:
            # Employee Management System backend. The path is passed through unchanged.
            - id: ems-api
              uri: ${EMS_API_URL:http://localhost:8080}
              predicates:
                - Path=/api/**

            # Student Finance (PHP). The /finance prefix is removed before forwarding.
            - id: finance
              uri: ${FINANCE_URL:http://localhost:8081}
              predicates:
                - Path=/finance/**
              filters:
                - StripPrefix=1

            # React frontend. Catch-all route, so it must be checked last.
            - id: frontend
              uri: ${FRONTEND_URL:http://localhost:5173}
              order: 1000
              predicates:
                - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.robinmwaniki.gateway: INFO