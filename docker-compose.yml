name: ems-gateway-local

# Local development setup.
#  - gateway: this project
#  - api-stub, finance-stub, frontend-stub: echo services that stand in for the
#    real applications until they are ready
#  - keycloak + keycloak-db: the login server and its database
#
# Everything here is for LOCAL use only: default passwords, HTTP, start-dev mode.
services:
  gateway:
    build: .
    ports:
      - "9000:9000"
    environment:
      EMS_API_URL: http://api-stub:80
      FINANCE_URL: http://finance-stub:80
      FRONTEND_URL: http://frontend-stub:80
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # The issuer is what browsers see (localhost). The key set is fetched from
      # inside the Docker network, so it uses the service name instead.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/ems
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ems/protocol/openid-connect/certs
    depends_on:
      - api-stub
      - finance-stub
      - frontend-stub
      - keycloak

  api-stub:
    image: traefik/whoami:latest

  finance-stub:
    image: traefik/whoami:latest

  frontend-stub:
    image: traefik/whoami:latest

  keycloak-db:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    # --import-realm creates the "ems" realm from the file below on first start.
    # It is skipped if the realm already exists. To re-import: docker compose down -v
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak}
      # Fixed public address, so every token has the same issuer no matter
      # whether it was requested from the host or from another container.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-ems.json:/opt/keycloak/data/import/realm-ems.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

volumes:
  keycloak-db-data: